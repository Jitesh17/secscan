name: Feature request
description: Suggest a new scanner, flag, output format, or workflow
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the user need, not the solution. "I want to scan X but secscan can't" is more useful than "add support for Y".
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What do you have in mind?
      description: Sketch the CLI flag, scanner, or behaviour. Rough is fine.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any existing tools or workarounds you've tried, and why they fall short.
  - type: dropdown
    id: scope
    attributes:
      label: Rough scope
      options:
        - New scanner
        - New report format / output
        - CLI flag or behaviour change
        - Dashboard improvement
        - Remediation / AI enrichment
        - Packaging / install
        - Other
    validations:
      required: true
